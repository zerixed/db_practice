version: '3.8'

services:
    db:
        image: postgres:16-alpine
        container_name: db_practice_postgres
        restart: always
        environment:
            POSTGRES_USER: ${DB_USER}
            POSTGRES_PASSWORD: ${DB_PASS}
            POSTGRES_DB: ${DB_NAME}
        ports:
            - "${DB_PORT}:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data

    bot:
        build: .
        container_name: db_practice_bot
        restart: always
        depends_on:
            - db
        environment:
            - BOT_TOKEN=${BOT_TOKEN}
            - DB_USER=${DB_USER}
            - DB_PASS=${DB_PASS}
            - DB_NAME=${DB_NAME}
            - DB_HOST=db
            - DB_PORT=5432

volumes:
    postgres_data: